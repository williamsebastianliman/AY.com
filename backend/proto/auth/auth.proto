syntax = "proto3";

package auth;

option go_package = "github.com/williamsebastianliman/WEB-WS-242/proto/gen/go/proto/auth/authpb;authpb";

message SendOTPRequest {
  string user_id = 1;
  string email = 2;
}

message SendOTPResponse {
  string request_id = 1;
}

message VerifyOTPRequest {
  string request_id = 1;
  string code       = 2;
}

message VerifyOTPResponse {
  bool success = 1;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message RefreshTokenRequest{
  string refresh_token=1;
}

message RefreshTokenResponse{
  string access_token=1;
  string refresh_token=2;
}

message CreateSecurityAnswerRequest{
  string user_id=1;
  string question=2;
  string answer=3;
}

message CreateSecurityAnswerResponse{
  string request_id=1;
}

message GetSecurityAnswerRequest{
  string user_id=1;
}

message GetSecurityAnswerResponse{
  string id=1;
  string user_id=2;
  string question=3;
  string answer_hash=4;
}

message CheckSecurityAnswerRequest {
  string user_id     = 1;
  string question    = 2;
  string answer      = 3;
  string new_password = 4;
}

message CheckSecurityAnswerResponse {
  bool success = 1;
  string error_message = 2;
}

service AuthService{
  rpc SendOTP(SendOTPRequest) returns (SendOTPResponse);
  rpc VerifyOTP(VerifyOTPRequest) returns (VerifyOTPResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
}

service SecurityAnswerService{
  rpc CreateSecurityAnswer(CreateSecurityAnswerRequest) returns (CreateSecurityAnswerResponse);
  rpc GetSecurityAnswers(GetSecurityAnswerRequest) returns (stream GetSecurityAnswerResponse);
  rpc CheckSecurityAnswer(CheckSecurityAnswerRequest) returns (CheckSecurityAnswerResponse);
}