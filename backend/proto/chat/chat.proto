syntax = "proto3";

package chat;

option go_package = "github.com/williamsebastianliman/WEB-WS-242/proto/gen/go/proto/chat/chatpb;chatpb";

message Chat {
  string chat_id = 1;
  string group_id = 2;
  string sender_id = 3;
  string message = 4;
  bool is_masked = 5;
  string created_at = 6;
}

message Group {
  string group_id = 1;
  bool is_private = 2;
  repeated string members = 3;
}

message CreateChatRequest {
  string group_id = 1;
  string sender_id = 2;
  string message = 3;
}
message CreateChatResponse {}

message CreateGroupRequest {
  repeated string member_ids = 1;
}
message CreateGroupResponse {
  string group_id = 1;
}

message AddMemberRequest {
  string group_id = 1;
  string user_id = 2;
}
message AddMemberResponse {}

message RemoveMemberRequest {
  string group_id = 1;
  string user_id = 2;
}
message RemoveMemberResponse {}

message CreateConversationRequest {
  string user_a = 1;
  string user_b = 2;
}
message CreateConversationResponse {
  string group_id = 1;
}

message GetAllGroupsByUserRequest {
  string user_id = 1;
}
message GetAllGroupsByUserResponse {
  repeated Group groups = 1;
}

message GetAllChatsByGroupRequest {
  string group_id = 1;
}
message GetAllChatsByGroupResponse {
  repeated Chat chats = 1;
}

message DeleteChatRequest {
  string chat_id = 1;
}
message DeleteChatResponse {}

message MaskChatRequest {
  string chat_id = 1;
}
message MaskChatResponse {}

message GroupMember {
  string group_id = 1;
  string member_id = 2;
}

message GetAllMembersByGroupRequest {
  string group_id = 1;
}

message GetAllMembersByGroupResponse {
  repeated GroupMember members = 1;
}

service ChatService {
  rpc CreateChat(CreateChatRequest) returns (CreateChatResponse);
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  rpc AddMember(AddMemberRequest) returns (AddMemberResponse);
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  rpc CreateConversation(CreateConversationRequest) returns (CreateConversationResponse);
  rpc GetAllGroupsByUser(GetAllGroupsByUserRequest) returns (GetAllGroupsByUserResponse);
  rpc GetAllChatsByGroup(GetAllChatsByGroupRequest) returns (GetAllChatsByGroupResponse);
  rpc DeleteChat(DeleteChatRequest) returns (DeleteChatResponse);
  rpc MaskChat(MaskChatRequest) returns (MaskChatResponse);
  rpc GetAllMembersByGroup(GetAllMembersByGroupRequest) returns (GetAllMembersByGroupResponse);
}